# Name and version
name: Ducklin
version: ${project.version}

# Project metadata
author: The Slimefun 4 Community
website: https://github.com/Slimefun
description: Ducklin

# Technical settings
main: io.github.ducklin.core.Slimefun
api-version: '1.21'

# (Soft) dependencies of Slimefun, we hook into these plugins.
softdepend:
- PlaceholderAPI
- WorldEdit
- ClearLag
- mcMMO
- ItemsAdder
- Orebfuscator

# Our commands
commands:
  slimefun:
    aliases: sf
    description: Slimefun base command
    usage: The Slimefun version you have installed does not seem to be compatible with your server setup. Check your console for more detailed info.

# Default permissions
permissions:
  ducklin.command.guide:
    description: Allows you to obtain the Slimefun guide book
    default: true
  ducklin.command.search:
    description: Allows you to do /sf search
    default: true
  ducklin.command.open_guide:
    description: Allows you to open the SF guide without the book
    default: op
  ducklin.cheat.items:
    description: Allows you to cheat Items
    default: op
  ducklin.cheat.researches:
    description: Allows you to cheat Researches
    default: op
  ducklin.stats.others:
    description: Allows you to see the Stats from other Players
    default: op
  ducklin.android.upload-script:
    description: Allows you to upload an Android Script
    default: op
  ducklin.command.timings:
    description: Allows you to do /sf timings
    default: op
  ducklin.command.teleporter:
    description: Allows you to do /sf teleporter
    default: op
  ducklin.command.versions:
    description: Allows you to do /sf versions
    default: op
  ducklin.command.backpack:
    description: Allows you to do /sf backpack
    default: op
  ducklin.command.charge:
    description: Allows you to do /sf charge
    default: op
  ducklin.command.debug:
    description: Allows you to do /sf debug
    default: op
  ducklin.android.bypass:
    description: Allows you to edit other Players Androids
    default: op
  ducklin.cargo.bypass:
    description: Allows you to edit other Players Cargo Blocks
    default: op
  ducklin.inventory.bypass:
    description: Allows you to open all Slimefun Machines
    default: op
  ducklin.gps.bypass:
    description: Allows you to open all GPS inventories
    default: op
  ducklin.debugging:
    description: Allows you to use the debugging tool from Slimefun
    default: op
